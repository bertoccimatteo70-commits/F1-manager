name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'src/**'
      - 'public/**'
      - 'android/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'index.html'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  GRADLE_OPTS: >-
    -Dorg.gradle.internal.http.connectionTimeout=120000
    -Dorg.gradle.internal.http.socketTimeout=120000

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The setup-android action fails on current runner images ("Failed to find
      # package 'tools'"), so the preinstalled SDK is configured directly.
      - name: Configure Android SDK
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -name sdkmanager -type f 2>/dev/null | head -n 1)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager non trovato in $SDK_ROOT" >&2
            exit 1
          fi
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "Android SDK pronto"

      # gradle.org answers 504 from the runners and the image ships Gradle 9,
      # which is incompatible with the Capacitor 6 Android Gradle plugin.
      # Gradle 8.2.1 is fetched from a mirror instead.
      - name: Install Gradle 8.2.1
        run: |
          set -euo pipefail
          VERSION="8.2.1"
          mkdir -p "$HOME/gradle-dist"
          URL_TENCENT="https://mirrors.cloud.tencent.com/gradle/gradle-${VERSION}-bin.zip"
          URL_HUAWEI="https://repo.huaweicloud.com/gradle/gradle-${VERSION}-bin.zip"
          if ! curl -fsSL --retry 3 --retry-delay 5 --connect-timeout 30 --max-time 600 -o /tmp/gradle.zip "$URL_TENCENT"; then
            curl -fsSL --retry 3 --retry-delay 5 --connect-timeout 30 --max-time 600 -o /tmp/gradle.zip "$URL_HUAWEI"
          fi
          unzip -q /tmp/gradle.zip -d "$HOME/gradle-dist"
          echo "$HOME/gradle-dist/gradle-${VERSION}/bin" >> "$GITHUB_PATH"
          "$HOME/gradle-dist/gradle-${VERSION}/bin/gradle" -v

      - name: Build debug APK
        working-directory: android
        run: |
          set -euo pipefail
          chmod +x gradlew
          gradle assembleDebug --no-daemon --stacktrace

      - name: Prepare APK artifact
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk "F1-Career-Simulator-1.0.1.apk"
          ls -lh "F1-Career-Simulator-1.0.1.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: f1-career-simulator-apk
          path: F1-Career-Simulator-*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: F1-Career-Simulator-*.apk
          fail_on_unmatched_files: true
